# Dependabot version updates. Security updates are a separate repository
# setting (Settings → Code security → Dependabot security updates).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      # SvelteKit, its plugins and svelte-check move together; separate PRs
      # would each fail `npm run check` against the others' old versions.
      svelte:
        patterns:
          - 'svelte'
          - 'svelte-check'
          - '@sveltejs/*'
      # Everything else that isn't a major bump, in one PR a week.
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: build
      include: scope

  # The actions used in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Berlin
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci
